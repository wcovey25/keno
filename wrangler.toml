# Keno Scanner — Cloudflare Workers (static assets) deployment.
# The app is 100% client-side: all parsing, seed hashing and statistics run in
# the browser (Web Workers). Cloudflare only serves the built files from ./dist.
name = "keno-scanner"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
